# Full stack for a single server (MVP/beta): web, API, worker, beat, database, Redis, Caddy.
# Only Caddy is reachable from outside (ports 80/443). Everything else stays on the private network.
# Redis has no password: it is only on that private network. Do not publish its port.
#
#   cp infra/prod.env.example infra/prod.env     # then fill in real values (never commit it)
#   docker compose --env-file infra/prod.env -f infra/docker-compose.prod.yml up -d --build
#
name: aitp-prod

# Shared by api, worker, beat and migrate. Only `api` builds it; the others reuse the image.
x-api: &api
  image: aitp-api:${GIT_SHA:-local}
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: &log-limits
    driver: json-file
    options: { max-size: "10m", max-file: "5" }
  environment: &api-env
    APP_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TRADING_MODE: ${TRADING_MODE:-paper}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trading}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    SENTRY_DSN: ${SENTRY_DSN:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [internal]

services:
  db:
    image: timescale/timescaledb:2.32.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  # Runs once per deploy, applies database migrations, then exits.
  migrate:
    <<: *api
    restart: "no"
    healthcheck: { disable: true }  # the image check targets the API port
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *api
    build:
      context: ../apps/api
      args:
        GIT_SHA: ${GIT_SHA:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *api
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *api
    healthcheck: { disable: true }  # beat has no port; the worker log shows its heartbeat task
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: aitp-web:${GIT_SHA:-local}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *log-limits
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *log-limits
    depends_on:
      web: { condition: service_healthy }
    networks: [internal]

networks:
  internal:

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
