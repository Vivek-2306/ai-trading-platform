[project]
name = "trading-api"
version = "0.1.0"
description = "AI Trading Platform backend: API, workers and engines"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Application, not a library: run from this folder, no wheel build.
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W/F pycodestyle+pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, RUF ruff,
# ASYNC async pitfalls, N naming, DTZ timezone-aware datetimes (prices are time series),
# T20 no print() — use the logger.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "N", "DTZ", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: needs real Postgres/Redis (Docker); skipped unless selected",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
skip_empty = true
