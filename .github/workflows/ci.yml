name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# One run per branch/PR; a new push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Lint (Ruff)
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .

      - name: Type-check (mypy strict)
        run: uv run mypy

      - name: Unit tests (pytest)
        run: uv run pytest

      - name: Integration tests (real TimescaleDB + Redis via testcontainers)
        run: uv run pytest -m integration --cov-append

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA::7} -t aitp-api:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name api-smoke -p 8000:8000 aitp-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "API container did not become healthy"; docker logs api-smoke; exit 1
